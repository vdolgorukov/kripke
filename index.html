<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Truth of Formulas in a Kripke Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --paper:#ffffff;
  --text:#22252d;
  --muted:#5f6576;
  --stroke:#000000;
  --node:#e1e5f2;
  --rule:#dde0e8;
  --rule-strong:#a3a9b8;
  --accent:#34438b;
  --on-accent:#ffffff;
  --ok:#2c7a4b;
  --err:#b53a2f;
  --tint:#f3f5fa;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#16181d; --text:#e4e6ec; --muted:#9aa0b1; --stroke:#e8eaf0; --node:#2f3651;
    --rule:#2d313c; --rule-strong:#565c6e; --accent:#a4b3f2; --on-accent:#141826;
    --ok:#66c48b; --err:#f08172; --tint:#1e2129; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#16181d; --text:#e4e6ec; --muted:#9aa0b1; --stroke:#e8eaf0; --node:#2f3651;
  --rule:#2d313c; --rule-strong:#565c6e; --accent:#a4b3f2; --on-accent:#141826;
  --ok:#66c48b; --err:#f08172; --tint:#1e2129; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--paper);color:var(--text);
  font-family:"PT Serif",Georgia,"Times New Roman",serif;
  font-size:1.0625rem;line-height:1.6;-webkit-text-size-adjust:100%;
}
main{max-width:1120px;margin:0 auto;padding:2.25rem 1.5rem 3rem}
h1{font-size:clamp(1.55rem,1.2rem + 1.4vw,2.1rem);line-height:1.2;font-weight:700;margin:0 0 .45rem;letter-spacing:-.005em}
.lead{margin:0;color:var(--muted);max-width:64ch}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
.seg{display:inline-flex;flex-shrink:0;border:1.5px solid var(--rule-strong);border-radius:6px;overflow:hidden}
.lang{margin-top:.3rem}
.seg button{font:inherit;font-size:.85rem;letter-spacing:.04em;min-width:44px;min-height:36px;padding:0 .6rem;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button + button{border-left:1.5px solid var(--rule-strong)}
.seg button:hover{color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1rem;margin:1.4rem 0 2rem;padding-bottom:1.25rem;border-bottom:1px solid var(--rule)}
.variant{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.variant label{color:var(--muted)}
.variant input{
  font:inherit;width:7.5ch;padding:.35rem .5rem;border:1.5px solid var(--rule-strong);border-radius:6px;
  background:var(--paper);color:var(--text);font-variant-numeric:tabular-nums;
}
.variant input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.msg{color:var(--err);font-size:.9rem;flex-basis:100%}
.msg:empty{display:none}
.spacer{flex:1}
.level{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.level-label{color:var(--muted)}
.level .seg button{letter-spacing:0;font-size:.92rem;padding:0 .75rem}
.relbar{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:.1rem 1rem}
.rel-label{color:var(--muted)}
.rel-opts{display:flex;flex-wrap:wrap;gap:0 1rem}
.chk{display:inline-flex;align-items:center;gap:.4rem;min-height:36px;cursor:pointer}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--accent);cursor:pointer}
.chk input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chk input:disabled{cursor:default}
.chk input:disabled + span{color:var(--muted);cursor:default}
.logic{margin-left:auto;color:var(--muted);white-space:nowrap}
.logic b{color:var(--text)}
.relinfo{display:block;font-size:.9rem}
.implied{display:block;font-size:.95rem;color:var(--text);font-style:italic}
.viewopts{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;margin-top:.75rem}
.btn.sm.toggle{min-height:36px}
.btn.toggle[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{background:transparent}

.btn{
  font:inherit;font-size:.97rem;min-height:40px;padding:.4rem 1rem;border-radius:6px;cursor:pointer;
  border:1.5px solid var(--accent);background:transparent;color:var(--accent);
}
.btn:hover{background:var(--tint)}
.btn.sm{min-height:32px;padding:.1rem .75rem;font-size:.88rem}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:focus-visible,.linkbtn:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:2.75rem;align-items:start}
@media (max-width:880px){.workspace{grid-template-columns:minmax(0,1fr);gap:1.75rem}}

figure{margin:0}
#kripke{display:block;width:100%;max-width:540px;height:auto;margin:0 auto;color:var(--stroke)}
#kripke .edge{fill:none;stroke:var(--stroke);stroke-width:1.35}
#kripke .ah{fill:var(--stroke)}
#kripke .world{fill:var(--node);stroke:var(--stroke);stroke-width:1.4}
#kripke .lbl-text{font-family:"PT Serif",Georgia,serif;font-style:italic;fill:var(--stroke)}
figcaption{text-align:center;color:var(--muted);font-size:.95rem;margin-top:.6rem}

details{margin-top:1.25rem;border-top:1px solid var(--rule);padding-top:.75rem}
summary{cursor:pointer;color:var(--accent);width:max-content;max-width:100%}
.setlist{list-style:none;margin:.75rem 0 0;padding:0;display:grid;gap:.45rem}
.setlist li{line-height:2}
.note{color:var(--muted);font-size:.95rem;margin:.6rem 0 0}
.sem{margin:.75rem 0 0;padding:0;list-style:none;display:grid;gap:.5rem}

.m{display:inline-block;line-height:1}
.m svg{overflow:visible}
.m-fallback{font-style:normal}
.m-fallback i{font-style:italic}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:collapse;width:100%;min-width:330px}
.grid th,.grid td{padding:.5rem .3rem;border-bottom:1px solid var(--rule);text-align:center;vertical-align:middle}
.grid thead th{font-weight:400;color:var(--muted);border-bottom:1.5px solid var(--rule-strong);padding-top:0}
.grid .fcol{text-align:left;padding-left:0;width:100%}
.fhead{display:flex;align-items:baseline;gap:.5rem}
.num{color:var(--muted);font-variant-numeric:tabular-nums;min-width:2em}
.formula{font-size:1.12rem;white-space:nowrap}
.grid .nonecol{border-left:1px solid var(--rule);padding-left:.55rem}
.nonehead{display:inline-block;font-size:.8rem;line-height:1.15;max-width:5.2em}
.res.muted{color:var(--muted)}
.rowstatus{display:flex;gap:.9rem;align-items:center;min-height:32px;margin:.3rem 0 0 2.5em;font-size:.9rem}
.rowstatus [hidden]{display:none}
.res.ok{color:var(--ok)}
.res.bad{color:var(--err)}
.linkbtn{font:inherit;font-size:inherit;background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer}

.cell{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;cursor:pointer;vertical-align:middle}
.cell input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.box{
  width:28px;height:28px;border:1.5px solid var(--rule-strong);border-radius:5px;display:grid;place-items:center;
  background:var(--paper);color:var(--on-accent);transition:background-color .12s,border-color .12s;
}
.box svg{width:16px;height:16px;display:none}
.cell:hover .box{border-color:var(--accent)}
.cell input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.cell input:checked + .box{background:var(--accent);border-color:var(--accent)}
.cell input:checked + .box .i-check{display:block}
.cell.r-hit input + .box{background:var(--ok);border-color:var(--ok)}
.cell.r-extra input + .box{background:var(--err);border-color:var(--err)}
.cell.r-extra input:checked + .box .i-check{display:none}
.cell.r-extra input:checked + .box .i-cross{display:block}
.cell.r-miss .box{border:2px dashed var(--err);background:transparent;color:var(--err)}
.cell.r-miss .box .i-check{display:block}

tr.bd td{text-align:left;background:var(--tint);padding:.65rem .9rem}
tr.bd[hidden]{display:none}
.bd-intro{margin:0 0 .4rem;color:var(--muted);font-size:.9rem}
.bd-list{list-style:none;margin:0;padding:0;display:grid;gap:.45rem}

.actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.25rem}
#summary{margin:1rem 0 0;font-size:1.05rem;min-height:1.6em}
#summary .ok{color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:.5rem 1.4rem;margin-top:.9rem;color:var(--muted);font-size:.9rem}
.legend[hidden]{display:none}
.lg{display:inline-flex;align-items:center;gap:.45rem}
.sw{width:18px;height:18px;border-radius:4px;display:inline-grid;place-items:center;color:var(--on-accent)}
.sw svg{width:12px;height:12px}
.sw-hit{background:var(--ok)}
.sw-extra{background:var(--err)}
.sw-miss{border:2px dashed var(--err);color:var(--err)}

@media (max-width:520px){
  main{padding:1.5rem 1rem 2.5rem}
  .cell{width:38px;height:38px}
  .box{width:26px;height:26px}
  .rowstatus{margin-left:0;flex-wrap:wrap}
}
/* узкий экран: формула занимает отдельную строку над клетками, горизонтальной прокрутки нет */
@media (max-width:560px){
  table.grid{min-width:0}
  table.grid,.grid thead,.grid tbody{display:block}
  .grid tr{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));align-items:center;border-bottom:1px solid var(--rule)}
  .grid thead tr{border-bottom:1.5px solid var(--rule-strong)}
  .grid th,.grid td{border-bottom:0;padding:.35rem .1rem}
  .grid thead th{padding-bottom:.4rem}
  .grid .fcol{grid-column:1 / -1;padding:.65rem 0 .1rem}
  .grid thead th.fcol{display:none}
  .grid tr.bd:not([hidden]){display:block}
  .grid tr.bd td{display:block}
}
@media (prefers-reduced-motion:reduce){.box{transition:none}}

<script>
(function () {
  'use strict';

  /* ================= Логика (без DOM) ================= */

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function popcount(m) { var c = 0; while (m) { c += m & 1; m >>>= 1; } return c; }
  function bitsOf(mask, n) { var r = []; for (var i = 0; i < n; i++) if (mask >> i & 1) r.push(i); return r; }

  function weaklyConnected(n, succ) {
    var seen = 1, stack = [0];
    while (stack.length) {
      var i = stack.pop();
      for (var j = 0; j < n; j++) {
        if (seen >> j & 1) continue;
        if ((succ[i] >> j & 1) || (succ[j] >> i & 1)) { seen |= 1 << j; stack.push(j); }
      }
    }
    return seen === (1 << n) - 1;
  }

  // Модель с исходного рисунка: запасной вариант
  var PICTURE_MODEL = {
    n: 4,
    val: [{ p: true, q: false }, { p: true, q: true }, { p: true, q: false }, { p: false, q: true }],
    succ: [14, 2, 0, 4]
  };

  // Уровни сложности. Параметры «medium» совпадают с исходным генератором,
  // поэтому прежние номера вариантов дают те же задания.
  var LEVELS = {
    easy: {
      worlds: function (rng) { return rng() < 0.5 ? 3 : 4; },
      pEdge: { 3: 0.42, 4: 0.34 }, maxEdges: function (n) { return 2 * n - 1; }, maxBidir: 1,
      count: function () { return 4; },
      slots: function (rng) {
        var s = ['S1', 'S1', 'S1', 'S3'];
        if (rng() < 0.35) s[1] = 'S4e';
        return s;
      },
      alt: ['S1', 'S3'], maxSize: 5, emptyChance: 0.3, needDepth: 1
    },
    medium: {
      worlds: function (rng) { return rng() < 0.5 ? 4 : 5; },
      pEdge: { 4: 0.34, 5: 0.28 }, maxEdges: function (n) { return 2 * n - 1; }, maxBidir: 1,
      count: function (rng) { return rng() < 0.5 ? 5 : 6; },
      slots: function (rng, k) {
        var s = ['S1', 'S1', 'S2', 'S3', 'S5'];
        if (rng() < 0.35) s[1] = 'S4';
        if (k === 6) s.push(rng() < 0.5 ? 'S3' : 'S2');
        return s;
      },
      alt: ['S1', 'S3', 'S2', 'S5'], maxSize: 9, emptyChance: 0.5, needDepth: 0
    },
    hard: {
      worlds: function () { return 5; },
      atoms: function (rng) { return rng() < 0.5 ? ['p', 'q', 'r'] : ['p', 'q', 'r', 's']; },
      pEdge: { 5: 0.33 }, maxEdges: function (n) { return 2 * n + 1; }, maxBidir: 2,
      count: function (rng) { return rng() < 0.5 ? 6 : 7; },
      slots: function (rng, k) {
        var s = ['S3', 'S5', 'S6', 'S9', 'S7', 'S8'];
        if (k === 7) s.push(rng() < 0.5 ? 'S7' : 'S6');
        return s;
      },
      alt: ['S7', 'S6', 'S5', 'S9', 'S3', 'S2'], maxSize: 14, emptyChance: 0.5, needDepth: 4, allAtoms: true
    }
  };

  // ----- свойства отношения достижимости -----
  // u универсальное, r рефлексивное, s симметричное, t транзитивное, d сериальное, e евклидово
  var REL_ORDER = 'urstde';
  function relNormalize(str) {
    var P = {}, i;
    for (i = 0; i < (str || '').length; i++) if (REL_ORDER.indexOf(str[i]) >= 0) P[str[i]] = true;
    if (P.u) { P.r = P.s = P.t = P.d = P.e = true; }
    // добавляем следствия выбранных свойств
    var ch = true;
    function set(k) { if (!P[k]) { P[k] = true; ch = true; } }
    while (ch) {
      ch = false;
      if (P.r) set('d');
      if (P.s && P.t) set('e');
      if (P.s && P.e) set('t');
      if (P.r && P.e) { set('s'); set('t'); }
      if (P.s && P.t && P.d) set('r');
    }
    return P;
  }
  function relKey(P) { return REL_ORDER.split('').filter(function (c) { return P[c]; }).join(''); }
  var LOGICS = {
    '': 'K', d: 'D', rd: 'T', s: 'KB', t: 'K4', e: 'K5', sd: 'KDB', td: 'D4', de: 'D5', te: 'K45',
    tde: 'KD45', ste: 'KB5', rsd: 'B', rtd: 'S4', rstde: 'S5', urstde: 'S5'
  };
  // замыкание отношения по свойствам
  function closeRel(succ, n, P) {
    var full = (1 << n) - 1, i, j, ch = true;
    if (P.u) { for (i = 0; i < n; i++) succ[i] = full; return; }
    while (ch) {
      ch = false;
      for (i = 0; i < n; i++) {
        var old = succ[i];
        if (P.r) succ[i] |= 1 << i;
        for (j = 0; j < n; j++) {
          if (!(succ[i] >> j & 1)) continue;
          if (P.t) succ[i] |= succ[j];
          if (P.s && !(succ[j] >> i & 1)) { succ[j] |= 1 << i; ch = true; }
          // евклидовость: wRj и wRk влекут jRk
          if (P.e && (succ[j] | succ[i]) !== succ[j]) { succ[j] |= succ[i]; ch = true; }
        }
        if (succ[i] !== old) ch = true;
      }
    }

    }

    // имена миров снаружи кружков
    var cands = [Math.PI / 4, 3 * Math.PI / 4, -Math.PI / 4, -3 * Math.PI / 4, 0, Math.PI, Math.PI / 2, -Math.PI / 2];
    var pref = [10, 7, 4, 3, 2, 2, 1, 0];
    for (i = 0; i < n; i++) {
      var outB = Math.atan2(pos[i].y - cy, pos[i].x - cx);
      var bi = 0, bs = -1e9;
      for (var c = 0; c < cands.length; c++) {
        var sc2 = Math.min(minGap(cands[c], occ[i]), 1.6) * 57.3 + 22 * Math.cos(cands[c] - outB) + pref[c];
        if (sc2 > bs) { bs = sc2; bi = c; }
      }
      var dir = U(cands[bi]), gap = 10;
      var wl = svgLabel(worldTex(i), 'w', String(i + 1), 20);
      var sx = dir.x > 0.3 ? 1 : dir.x < -0.3 ? -1 : 0, sy = dir.y > 0.3 ? 1 : dir.y < -0.3 ? -1 : 0;
      var bx = pos[i].x + dir.x * (R + gap) + sx * wl.w / 2;
      var by = pos[i].y + dir.y * (R + gap) + sy * wl.h / 2;
      wl.place(bx, by);
      gL.appendChild(wl.el);
      ext.push({ x: bx - wl.w / 2, y: by - wl.h / 2 }, { x: bx + wl.w / 2, y: by + wl.h / 2 });
    }

    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    ext.forEach(function (p) { minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); });
    var pad = 12;
    svg.setAttribute('viewBox', [fx(minX - pad), fx(minY - pad), fx(maxX - minX + 2 * pad), fx(maxY - minY + 2 * pad)].join(' '));

    // текстовое описание для экранных читалок
    var parts = [];
    for (i = 0; i < n; i++) {
      var at = [];
      atomsOf(m).forEach(function (a) { if (m.val[i][a]) at.push(a); });
      var sc3 = bitsOf(m.succ[i], n).map(worldTxt);
      parts.push(worldTxt(i) + ': ' + (at.length ? T('ariaTrue') + at.join(', ') : T('ariaAtomsFalse')) + T('ariaSucc') + (sc3.length ? sc3.join(', ') : T('ariaNone')));
    }
    svg.setAttribute('aria-label', T('ariaModel') + parts.join('. ') + '.');
  }

  function renderViewButtons() {
    var m = state.model;
    [['hide-refl', 'hideRefl', { r: true }, 'needRefl'], ['hide-trans', 'hideTrans', { t: true }, 'needTrans']].forEach(function (x) {
      var b = document.getElementById(x[0]), can = relHolds(m.succ, m.n, x[2]);
      b.disabled = !can;
      b.setAttribute('aria-pressed', can && view[x[1]] ? 'true' : 'false');
      b.title = can ? '' : T(x[3]);
    });
  }

  function renderModelText() {
    var m = state.model, n = m.n;
    var cap = document.getElementById('caption');
    cap.innerHTML = '';
    cap.appendChild(document.createTextNode(T('caption')));
    cap.appendChild(mathSpan('M = \\langle W, R, V\\rangle', '<i>M</i> = ⟨<i>W</i>, <i>R</i>, <i>V</i>⟩', 'M = ⟨W, R, V⟩'));
    if (m.rel) {
      var ri = document.createElement('span'); ri.className = 'relinfo';
      var P = relNormalize(m.rel);
      ri.textContent = P.u ? T('relAll') + ' · ' + T('logic') + ' S5'
        : 'R: ' + 'rstde'.split('').filter(function (c) { return P[c]; }).map(function (c) { return T('rel_' + c); }).join(', ') +
          ' · ' + T('logic') + ' ' + (LOGICS[m.rel] || '');
      cap.appendChild(ri);
    }
    var va = viewApplied(m);
    [['refl', 'impliedRefl'], ['trans', 'impliedTrans']].forEach(function (x) {
      if (!va[x[0]]) return;
      var im = document.createElement('span'); im.className = 'implied'; im.textContent = T(x[1]);
      cap.appendChild(im);
    });
    renderViewButtons();

    var ul = document.getElementById('sets');
    ul.innerHTML = '';
    var i, j, all = (1 << n) - 1;

    var liW = document.createElement('li');
    liW.appendChild(mathSpan('W = ' + setTex(all, n), '<i>W</i> = ' + setHtml(all, n), 'W = ' + setTxt(all, n)));
    ul.appendChild(liW);

    // R как множество пар; каждая пара отдельным фрагментом, чтобы длинная строка переносилась
    var pairs = [];
    for (i = 0; i < n; i++) for (j = 0; j < n; j++) if (m.succ[i] >> j & 1) pairs.push([i, j]);
    var liR = document.createElement('li');
    if (!pairs.length) {
      liR.appendChild(mathSpan('R = \\varnothing', '<i>R</i> = ∅', 'R = ∅'));
    } else {
      pairs.forEach(function (pr, idx) {
        var first = idx === 0, last = idx === pairs.length - 1;
        var tex = (first ? 'R = \\{' : '') + '\\langle ' + worldTex(pr[0]) + ', ' + worldTex(pr[1]) + '\\rangle' + (last ? '\\}' : ',');
        var html = (first ? '<i>R</i> = {' : '') + '⟨' + worldHtml(pr[0]) + ', ' + worldHtml(pr[1]) + '⟩' + (last ? '}' : ',');
        var txt = (first ? 'R = {' : '') + '⟨' + worldTxt(pr[0]) + ', ' + worldTxt(pr[1]) + '⟩' + (last ? '}' : ',');
        if (!first) liR.appendChild(document.createTextNode(' '));
        liR.appendChild(mathSpan(tex, html, txt));
      });
    }
    ul.appendChild(liR);

    atomsOf(m).forEach(function (a) {
      var mask = atomMask(m, a);
      var li = document.createElement('li');
      li.appendChild(mathSpan('V(' + a + ') = ' + setTex(mask, n),
        '<i>V</i>(<i>' + a + '</i>) = ' + setHtml(mask, n),
        'V(' + a + ') = ' + setTxt(mask, n)));
      ul.appendChild(li);
    });

    var sem = document.getElementById('sem');
    sem.innerHTML = '';
    [
      ["M, w \\models \\Box\\varphi \\iff \\forall w'\\,(wRw' \\Rightarrow M, w' \\models \\varphi)",
        '<i>M</i>, <i>w</i> ⊨ □φ ⇔ ∀<i>w′</i> (<i>wRw′</i> ⇒ <i>M</i>, <i>w′</i> ⊨ φ)',
        T('semBox')],
      ["M, w \\models \\Diamond\\varphi \\iff \\exists w'\\,(wRw' \\wedge M, w' \\models \\varphi)",
        '<i>M</i>, <i>w</i> ⊨ ◇φ ⇔ ∃<i>w′</i> (<i>wRw′</i> ∧ <i>M</i>, <i>w′</i> ⊨ φ)',
        T('semDia')]
    ].forEach(function (row) {
      var li = document.createElement('li');
      li.appendChild(mathSpan(row[0], row[1], row[2]));
      sem.appendChild(li);
    });
  }

  var ICONS = '<svg class="i-check" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
    '<svg class="i-cross" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';

  function renderTable() {
    var n = state.model.n;
    var thead = document.querySelector('#grid thead'), tbody = document.querySelector('#grid tbody');
    thead.innerHTML = ''; tbody.innerHTML = '';
    document.getElementById('grid').style.setProperty('--cols', String(n + 1));

    var hr = document.createElement('tr');
    var th0 = document.createElement('th'); th0.className = 'fcol'; th0.scope = 'col'; th0.textContent = T('formula');
    hr.appendChild(th0);
    for (var w = 0; w < n; w++) {
      var th = document.createElement('th'); th.scope = 'col';
      th.appendChild(mathSpan(worldTex(w), worldHtml(w), worldTxt(w)));
      hr.appendChild(th);
    }
    var thN = document.createElement('th'); thN.scope = 'col'; thN.className = 'nonecol';
    var nh = document.createElement('span'); nh.className = 'nonehead'; nh.textContent = T('none');
    thN.appendChild(nh);
    thN.title = T('noneTitle');
    hr.appendChild(thN);
    thead.appendChild(hr);

    state.formulas.forEach(function (f, fi) {
      var tr = document.createElement('tr');
      var td = document.createElement('td'); td.className = 'fcol';
      var head = document.createElement('div'); head.className = 'fhead';
      var num = document.createElement('span'); num.className = 'num'; num.textContent = '(' + (fi + 1) + ')';
      var fs = document.createElement('span'); fs.className = 'formula';
      fs.appendChild(mathSpan(toTex(f, false), italicLetters(toTxt(f, false)), toTxt(f, false)));
      head.appendChild(num); head.appendChild(fs);
      td.appendChild(head);

      var st = document.createElement('div'); st.className = 'rowstatus';
      var chk = document.createElement('button'); chk.type = 'button'; chk.className = 'btn sm rowcheck';
      chk.textContent = T('check');
      chk.setAttribute('aria-label', T('checkAria', fi + 1));
      chk.addEventListener('click', function () {
        state.checked[fi] = true;
        renderResults();
      });
      var res = document.createElement('span'); res.className = 'res';
      var tg = document.createElement('button'); tg.type = 'button'; tg.className = 'linkbtn';
      tg.setAttribute('aria-controls', 'bd-' + fi);
      tg.addEventListener('click', function () {
        state.open[fi] = !state.open[fi];
        renderResults();
      });
      st.appendChild(chk); st.appendChild(res); st.appendChild(tg);
      td.appendChild(st);
      tr.appendChild(td);

      // столбцы 0..n-1: миры, столбец n: «ни в одном из миров»
      var inputs = [], labs = [];
      for (var c2 = 0; c2 <= n; c2++) {
        (function (c) {
          var cell = document.createElement('td');
          if (c === n) cell.className = 'nonecol';
          var lab = document.createElement('label'); lab.className = 'cell';
          var inp = document.createElement('input'); inp.type = 'checkbox';
          inp.checked = state.marks[fi][c];
          inp.setAttribute('aria-label', c === n
            ? T('cellNone', fi + 1)
            : T('cellWorld', fi + 1, worldTxt(c)));
          inp.addEventListener('change', function () {
            state.marks[fi][c] = inp.checked;
            // «ни в одном» и отметки миров взаимно исключают друг друга
            if (inp.checked) {
              for (var o = 0; o <= n; o++) {
                if (o === c || (c < n && o < n)) continue;
                state.marks[fi][o] = false;
                inputs[o].checked = false;
              }
            }
            // после изменения отметок строку нужно проверить заново
            if (state.checked[fi]) {
              state.checked[fi] = false;
              state.open[fi] = false;
              renderResults();
            }
          });
          var box = document.createElement('span'); box.className = 'box'; box.innerHTML = ICONS;
          lab.appendChild(inp); lab.appendChild(box);
          cell.appendChild(lab);
          tr.appendChild(cell);
          inputs.push(inp); labs.push(lab);
        })(c2);
      }
      tbody.appendChild(tr);

      var bd = document.createElement('tr'); bd.className = 'bd'; bd.id = 'bd-' + fi; bd.hidden = true;
      var bdc = document.createElement('td'); bdc.colSpan = n + 2;
      var intro = document.createElement('p'); intro.className = 'bd-intro'; intro.textContent = T('bdIntro');
      var ul = document.createElement('ul'); ul.className = 'bd-list';
      subformulas(f).forEach(function (g) {
        var v = evalF(g, state.model);
        var li = document.createElement('li');
        li.appendChild(mathSpan('\\|' + toTex(g, false) + '\\| = ' + setTex(v, n),
          '‖' + italicLetters(toTxt(g, false)) + '‖ = ' + setHtml(v, n),
          '‖' + toTxt(g, false) + '‖ = ' + setTxt(v, n)));
        ul.appendChild(li);
      });
      bdc.appendChild(intro); bdc.appendChild(ul);
      bd.appendChild(bdc);
      tbody.appendChild(bd);
    });
  }

  function renderResults() {
    var n = state.model.n;
    var rows = document.querySelectorAll('#grid tbody tr:not(.bd)');
    state.formulas.forEach(function (f, fi) {
      var tr = rows[fi];
      var labels = tr.querySelectorAll('label.cell');
      var st = tr.querySelector('.rowstatus'), res = st.querySelector('.res'), tg = st.querySelector('.linkbtn');
      var chk = st.querySelector('.rowcheck');
      var bd = document.getElementById('bd-' + fi);
      var done = state.checked[fi];
      var errs = 0;
      for (var c = 0; c <= n; c++) {
        var lab = labels[c];
        lab.classList.remove('r-hit', 'r-extra', 'r-miss');
        if (!done) continue;
        var t = cellTruth(fi, c), mk2 = state.marks[fi][c];
        if (t && mk2) lab.classList.add('r-hit');
        else if (!t && mk2) { lab.classList.add('r-extra'); errs++; }
        else if (t && !mk2) { lab.classList.add('r-miss'); errs++; }
      }
      chk.hidden = done;
      res.hidden = !done;
      tg.hidden = !done;
      if (done) {
        var answered = state.marks[fi].some(function (x) { return x; });
        res.textContent = !answered ? T('noAnswer') : errs === 0 ? T('correct') : T('errors', errs);
        res.className = 'res ' + (answered && errs === 0 ? 'ok' : 'bad');
        tg.textContent = state.open[fi] ? T('hideBreakdown') : T('breakdown');
        tg.setAttribute('aria-expanded', state.open[fi] ? 'true' : 'false');
      }
      bd.hidden = !(done && state.open[fi]);
    });
    document.getElementById('legend').hidden = !state.checked.some(Boolean);
    renderSummary();
  }

  // истинностное значение клетки: миры 0..n-1, столбец n означает «ни в одном из миров»
  function cellTruth(fi, c) {
    return c < state.model.n ? !!(state.truth[fi] >> c & 1) : state.truth[fi] === 0;
  }

  function score() {
    var n = state.model.n, good = 0, total = 0, rowsOk = 0;
    state.formulas.forEach(function (f, fi) {
      if (!state.checked[fi]) return;
      var ok = true;
      for (var c = 0; c <= n; c++) {
        total++;
        if (cellTruth(fi, c) === state.marks[fi][c]) good++; else ok = false;
      }
      if (ok) rowsOk++;
    });
    return { good: good, total: total, rowsOk: rowsOk };
  }

  function renderSummary() {
    var p = document.getElementById('summary');
    var done = state.checked.filter(Boolean).length, all = state.formulas.length;
    if (!done) { p.textContent = ''; return; }
    var s = score();
    if (done < all) {
      p.textContent = T('partial', done, all, s.rowsOk);
    } else if (s.good === s.total) {
      p.innerHTML = '<span class="ok">' + T('allOk') + '</span>';
    } else {
      p.textContent = T('total', s.good, s.total, s.rowsOk, state.formulas.length);
    }
  }

  function renderAll() {
    drawModel();
    renderModelText();
    renderTable();
    renderResults();
    document.getElementById('variant').value = String(state.seed);
  }

  /* ================= Управление ================= */

  function persist(seed) {
    try { localStorage.setItem('kripke-variant', String(seed)); } catch (e) { /* хранилище недоступно */ }
    try { history.replaceState(null, '', '#v=' + seed + (level === 'medium' ? '' : '&d=' + level) + (relSel ? '&rel=' + relSel : '') + (consts ? '&c=1' : '') + (lang === 'en' ? '' : '&lang=' + lang)); } catch (e) { /* адрес не меняется */ }
  }
  function randomSeed(except) {
    var s;
    do { s = 1 + Math.floor(Math.random() * 99999); } while (s === except);
    return s;
  }
  function initialSeed() {
    var mm = /v=(\d{1,5})/.exec(location.hash || '');
    if (mm && +mm[1] >= 1) return +mm[1];
    try {
      var s = parseInt(localStorage.getItem('kripke-variant'), 10);
      if (s >= 1 && s <= 99999) return s;
    } catch (e) { /* хранилище недоступно */ }
    return randomSeed();
  }

  function load(seed) {
    var rng = mulberry32((seed ^ 0x9E3779B9) >>> 0);
    state.seed = seed;
    state.model = genModel(rng, level, relEffectiveKey());
    state.layout = genLayout(state.model.n, rng);
    state.formulas = genFormulas(state.model, rng, level, consts);
    state.truth = state.formulas.map(function (f) { return evalF(f, state.model); });
    state.marks = state.formulas.map(function () { var a = []; for (var i = 0; i <= state.model.n; i++) a.push(false); return a; });
    state.open = state.formulas.map(function () { return false; });
    state.checked = state.formulas.map(function () { return false; });
    document.getElementById('variant-msg').textContent = '';
    persist(seed);
    renderAll();
  }

  document.getElementById('check').addEventListener('click', function () {
    state.checked = state.checked.map(function () { return true; });
    renderResults();
  });
  document.getElementById('reset').addEventListener('click', function () {
    state.marks = state.marks.map(function (r) { return r.map(function () { return false; }); });
    state.checked = state.checked.map(function () { return false; });
    state.open = state.open.map(function () { return false; });
    renderTable();
    renderResults();
  });
  document.getElementById('new').addEventListener('click', function () { load(randomSeed(state.seed)); });

  function openVariant() {
    var raw = document.getElementById('variant').value.trim();
    var v = /^\d{1,5}$/.test(raw) ? parseInt(raw, 10) : NaN;
    if (!(v >= 1 && v <= 99999)) {
      document.getElementById('variant-msg').textContent = T('badVariant');
      return;
    }
    load(v);
  }
  document.getElementById('open').addEventListener('click', openVariant);
  document.getElementById('variant').addEventListener('keydown', function (e) { if (e.key === 'Enter') openVariant(); });

  window.__onMathReady = function () {
    if (mathOn) return;
    mathOn = true;
    if (state.model) renderAll();
  };

  function setLang(l) {
    if (l === lang) return;
    lang = l;
    try { localStorage.setItem('kripke-lang', l); } catch (e) { /* хранилище недоступно */ }
    document.getElementById('variant-msg').textContent = '';
    applyStatic();
    persist(state.seed);
    renderAll();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function (b) {
    b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); });
  });

  // смена уровня: тот же номер варианта, но задание другого уровня
  function setLevel(l) {
    if (l === level) return;
    level = l;
    try { localStorage.setItem('kripke-level', l); } catch (e) { /* хранилище недоступно */ }
    applyStatic();
    load(state.seed);
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-level]'), function (b) {
    b.addEventListener('click', function () { setLevel(b.getAttribute('data-level')); });
  });

  // свойства отношения: тот же номер варианта, модель строится заново
  Array.prototype.forEach.call(document.querySelectorAll('[data-rel]'), function (inp) {
    inp.addEventListener('change', function () {
      var c = inp.getAttribute('data-rel');
      relSel = cleanRel(inp.checked ? relSel + c : relSel.replace(c, ''));
      // универсальное отношение влечёт все остальные свойства
      if (relSel.indexOf('u') >= 0) relSel = 'u';
      try { localStorage.setItem('kripke-rel', relSel); } catch (e) { /* хранилище недоступно */ }
      applyStatic();
      load(state.seed);
    });
  });

  [['hide-refl', 'hideRefl'], ['hide-trans', 'hideTrans']].forEach(function (x) {
    try { view[x[1]] = localStorage.getItem('kripke-' + x[1]) === '1'; } catch (e) { /* хранилище недоступно */ }
    document.getElementById(x[0]).addEventListener('click', function () {
      view[x[1]] = !view[x[1]];
      try { localStorage.setItem('kripke-' + x[1], view[x[1]] ? '1' : '0'); } catch (e) { /* хранилище недоступно */ }
      drawModel();
      renderModelText();
    });
  });

  document.getElementById('consts').addEventListener('click', function () {
    consts = !consts;
    try { localStorage.setItem('kripke-consts', consts ? '1' : '0'); } catch (e) { /* хранилище недоступно */ }
    applyStatic();
    load(state.seed);
  });

  lang = initialLang();
  level = initialLevel();
  relSel = initialRel();
  consts = initialConsts();
  applyStatic();
  load(initialSeed());
})();
</script>
</body>
